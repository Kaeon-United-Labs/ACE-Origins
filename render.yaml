# Render Blueprint: a static site. The whole game is static files, so there is nothing to build or run.
services:
  - type: web
    name: ace-origins
    runtime: static
    staticPublishPath: .
    buildCommand: echo "static site, nothing to build"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /Assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /Engine/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.json
        name: Cache-Control
        value: public, max-age=300
